name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Needs a postgres DB for prisma generate/build if doing integration tests
    # But since we use unit tests with mocks and playwright with dev server
    # We should setup a DB service for E2E
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: clinic_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/clinic_db?schema=public"
      JWT_SECRET: "test-secret"

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Prisma Generate
      run: npx prisma generate
      
    - name: Run Prisma Migrations
      run: npx prisma migrate dev --name ci
      
    - name: Seed Database
      run: npm run prisma:seed
      
    - name: Lint
      run: npm run lint
      
    - name: Build
      run: npm run build
      
    - name: Run Unit Tests
      run: npm run test:unit
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run E2E Tests
      run: npx playwright test
